<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tech LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <!-- Left Banner / Visual Side -->
        <div class="auth-banner">
            <a href="index.html" class="back-home-floating"><i class="fa-solid fa-house"></i> Home</a>        </div>

        <!-- Right Form Side -->
        <div class="auth-form-container">
            <div class="auth-card animate-scale">
                <div class="auth-header">
                    <h2>Create Account </h2>
                    <p>Fill in your details to get started for free.</p>
                </div>

                <form id="signupForm">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Create a strong password" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="role">Select Role</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user-tag"></i>
                            <select id="role" required>
                                <option value="student">Student</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                </form>

                <p class="auth-footer">Already have an account? <a href="signin.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
